name: Build desktop app

on:
  push:
    branches:
      - main

jobs:
  build_and_package:
    runs-on: ${{ matrix.os }}
    env:
      LOGION_RESOURCES_CONFIG: "https://raw.githubusercontent.com/princeton-logion/logion-app/main/src/resources/resources_config.yaml"
      LOGION_HOST: "127.0.0.1"
      LOGION_PORT: "8000"
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'macos-latest']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies -- Win
        if: matrix.os == 'windows-latest'
        run: |
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Install dependencies -- macOS
        if: matrix.os == 'macos-latest'
        run: |
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/nightly/cpu
      
      - name: Build backend exec -- Win
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --paths . --additional-hooks-dir=pyi_hooks --add-data "../resources/resources_config.yaml;." --add-data "../../requirements.txt;." --hidden-import=models --hidden-import=utils --hidden-import=features main.py
        working-directory: ./src/backend/
      
      - name: Build backend exec -- macOS
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --paths . --additional-hooks-dir=pyi_hooks --add-data "../resources/resources_config.yaml:." --add-data "../../requirements.txt:." --hidden-import=models --hidden-import=utils --hidden-import=features main.py
        working-directory: ./src/backend/

      - name: Create Artifact -- Win
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: backend-executable-windows
          path: ./src/backend/dist/

      - name: Create Artifact -- macOS
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: backend-executable-mac
          path: ./src/backend/dist/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install npm
        run: |
          npm install
        working-directory: ./src/frontend/

      - name: Pkg Frontend
        run: |
          npm run build
        working-directory: ./src/frontend/

      - name: Create Frontend Artifact -- Win
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-win
          path: ./src/frontend/build/

      - name: Create Frontend Artifact -- macOS
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-mac
          path: ./src/frontend/build/

      - name: Install npm
        run: |
          npm install
        working-directory: ./src/build/

      - name: Smoke test backend exec -- Win
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          STATIC_DIR: ${{ github.workspace }}/src/frontend/build
        run: |
          $backend = Start-Process -FilePath ./src/backend/dist/main.exe -PassThru -NoNewWindow `
            -RedirectStandardOutput backend_out.log -RedirectStandardError backend_err.log
          try {
            python src/backend/tests/ci_smoke.py
            if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
          } finally {
            Get-Content backend_out.log, backend_err.log -ErrorAction SilentlyContinue
            if (!$backend.HasExited) { Stop-Process -Id $backend.Id -Force }
          }

      - name: Build Electron App
        run: |
          npm run build
        working-directory: ./src/build/

      - name: Load Packaged App -- Win
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packaged-app-windows
          path: ./src/build/dist/

      - name: Load Packaged App -- macOS
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packaged-app-mac
          path: ./src/build/dist/
